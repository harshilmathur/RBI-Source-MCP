[project]
name = "rbi-source-mcp"
version = "0.9.0"
description = "An MCP server for RBI regulatory source material (Master Directions, Circulars, Press Releases, FAQs): version-aware, citation-first, knows what's withdrawn."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Harshil Mathur" },
]
keywords = ["mcp", "rbi", "fintech", "regulatory", "compliance", "india"]
classifiers = [
    # Live on PyPI with signed corpus releases via GitHub Actions. The
    # Pre-Alpha label was a v0.1 holdover; Beta reflects the actual
    # maturity surface.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # MCP server
    "mcp>=1.0.0",
    # Crawling + HTTP calls (used by the optional Cloudflare Workers AI
    # provider too)
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Storage: sqlite-vec is loaded as a SQLite extension; the Python pkg ships
    # the platform-appropriate .so/.dylib alongside a Python loader helper.
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    # Logging
    "structlog>=24.0.0",
    # v0.7.0: sentence-transformers + torch are now bundled as main deps so
    # `pip install rbi-source-mcp` works zero-config for local stdio users —
    # no Cloudflare account required. Pulls CPU-only torch (~250 MB on disk),
    # downloads bge-base-en-v1.5 (~440 MB) on first use to ~/.cache/huggingface.
    # Operators who don't want torch on the box can set
    # RBI_EMBEDDING_PROVIDER=cloudflare and the local model never loads — the
    # install-size trade buys a zero-config, no-API-account local UX.
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
# Optional anonymous server-side telemetry. PostHog Python SDK only —
# does NOT activate unless POSTHOG_API_KEY is set in the env. Installs
# without this extra never phone home.
#
# Two names for the same dep list: `telemetry` is the canonical name
# going forward; `hosted` is the original v0.6.2 name kept for back-compat
# (PEP 621 doesn't support extras aliases, so both are listed explicitly).
# `pip install "rbi-source-mcp[telemetry]"` is the documented form.
telemetry = [
    "posthog>=3.0.0",
]
hosted = [
    "posthog>=3.0.0",
]
# v0.8.0: optional cryptographic verification of the corpus signature
# in `rbi-source-fetch-corpus --verify-sigstore`. The sigstore-python
# package is heavy (~25 MB on disk) so we keep it opt-in. SHA256 verify
# (default) catches transport corruption; sigstore verify catches
# tampering by anyone short of the GitHub Actions OIDC root.
verify = [
    "sigstore>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "asgi-lifespan>=2.1.0",   # required to test HTTP server lifespan in-process
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
# Headline UX — most users only need these three.
rbi-source-mcp = "rbi_source_mcp.server:main"
rbi-source-mcp-http = "rbi_source_mcp.server_http:main"
rbi-source-fetch-corpus = "rbi_source_mcp.fetch_corpus:main"
rbi-source-doctor = "rbi_source_mcp.doctor:main"
# Advanced — used by the GitHub Actions corpus-release workflow and by
# users who want to crawl + index from scratch instead of fetching the
# prebuilt corpus.
rbi-source-crawl = "rbi_source_mcp.crawler.refresh:main"
rbi-source-index = "rbi_source_mcp.indexer.build_md_index:main"
rbi-source-index-all = "rbi_source_mcp.indexer.build_all:main"
rbi-source-index-circular = "rbi_source_mcp.indexer.build_circular_index:main"
rbi-source-index-all-circulars = "rbi_source_mcp.indexer.build_all_circulars:main"
rbi-source-index-press-release = "rbi_source_mcp.indexer.build_press_release_index:main"
rbi-source-index-faq = "rbi_source_mcp.indexer.build_faq_index:main"
rbi-source-index-master-circular = "rbi_source_mcp.indexer.build_master_circular_index:main"
rbi-source-eval = "rbi_source_mcp.eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rbi_source_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
