[project]
name = "rbi-source-mcp"
version = "0.6.1"
description = "An MCP server for RBI Master Directions: version-aware, citation-first, knows what's withdrawn."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Harshil Mathur" },
]
keywords = ["mcp", "rbi", "fintech", "regulatory", "compliance", "india"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # MCP server
    "mcp>=1.0.0",
    # Crawling + Cloudflare Workers AI HTTP calls (embeddings)
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Storage: sqlite-vec is loaded as a SQLite extension; the Python pkg ships
    # the platform-appropriate .so/.dylib alongside a Python loader helper.
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    # Logging
    "structlog>=24.0.0",
]

# v0.6: production embeds via Cloudflare Workers AI (provider=cloudflare in
# embedding_config.py). The runtime image only needs httpx for that — no
# torch, no model download, no GPU. Local devs who want on-device embeds
# opt into the heavy deps via:
#     uv sync --extra local-embeddings
# Pulls sentence-transformers + torch (~3 GB). The Fly image deliberately
# doesn't bundle this so deploys stay fast.
[project.optional-dependencies]
local-embeddings = [
    # bge-small-en-v1.5 via sentence-transformers. ~135 MB model download on
    # first use, cached locally. Pulls torch as a transitive dep.
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "asgi-lifespan>=2.1.0",   # required to test HTTP server lifespan in-process
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
rbi-source-mcp = "rbi_source_mcp.server:main"
rbi-source-mcp-http = "rbi_source_mcp.server_http:main"
rbi-source-crawl = "rbi_source_mcp.crawler.refresh:main"
rbi-source-index = "rbi_source_mcp.indexer.build_md_index:main"
rbi-source-index-all = "rbi_source_mcp.indexer.build_all:main"
rbi-source-index-circular = "rbi_source_mcp.indexer.build_circular_index:main"
rbi-source-index-all-circulars = "rbi_source_mcp.indexer.build_all_circulars:main"
rbi-source-index-press-release = "rbi_source_mcp.indexer.build_press_release_index:main"
rbi-source-index-faq = "rbi_source_mcp.indexer.build_faq_index:main"
rbi-source-index-master-circular = "rbi_source_mcp.indexer.build_master_circular_index:main"
rbi-source-eval = "rbi_source_mcp.eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rbi_source_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
