# RBI Source MCP — Fly.io app config
# Locked decisions from /plan-eng-review:
#   - Single Fly machine, $5/mo shared-cpu-1x@256mb
#   - auto_stop_machines = false (TTHW <2min target can't afford cold starts)
#   - 1GB volume at /data (corpus + telemetry + db-prev rollback)
#   - SIGHUP-based atomic swap on weekly refresh
#
# App name will be set when the user picks the final hosted URL.
# Until then, this file lives as a template; rename `app` and run `fly launch`.

app = "rbi-source-mcp"
primary_region = "bom"  # Mumbai, closest to RBI source data + likely user base

[build]
  dockerfile = "Dockerfile"

[env]
  RBI_SOURCE_DB = "/data/db.sqlite"
  PYTHONUNBUFFERED = "1"

[[mounts]]
  source = "rbi_data"
  destination = "/data"
  initial_size = "1gb"

# v0.1: stdio MCP only (no HTTP transport yet). When the HTTP wrapper lands,
# uncomment the [[services]] block below.
#
# [[services]]
#   protocol = "tcp"
#   internal_port = 8080
#   processes = ["app"]
#   auto_stop_machines = false
#   auto_start_machines = true
#   min_machines_running = 1
#
#   [[services.ports]]
#     port = 80
#     handlers = ["http"]
#     force_https = true
#
#   [[services.ports]]
#     port = 443
#     handlers = ["tls", "http"]
#
#   [services.concurrency]
#     type = "requests"
#     soft_limit = 50
#     hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Process group — single MCP server process.
[processes]
  app = "rbi-source-mcp"

# Deploy strategy: single-machine SIGHUP reload (per /plan-eng-review).
# For v0.1 we deploy via standard `fly deploy`; the SIGHUP-based corpus
# atomic swap is independent of code deploys and runs from the weekly
# GitHub Action.
[deploy]
  strategy = "rolling"
