# RBI Source MCP — Fly.io app config
#
# Reference deployment template. Forking? Run `fly launch --copy-config`
# and Fly will prompt for a fresh app name; the rest of this config
# (region, memory, volume, health check) is sane defaults for this
# workload and can be tweaked to taste.
#
# Operational notes:
#   - Single Fly machine, shared-cpu-1x with 1 GB RAM. v0.6 moved query
#     embedding to Cloudflare Workers AI, so we no longer carry a 250 MB
#     resident model. SQLite mmap pages + uvicorn + Python interpreter
#     fit comfortably in 1 GB.
#   - auto_stop_machines = "off" (kept always-on by user preference even
#     though cold-start is now ~5-10s post-CF-migration). If cost matters
#     more later, flip to "stop" + min_machines_running = 0 — first
#     request of an idle period pays ~5-10s startup, no model load tax.
#   - 1 GB volume at /data (bge-base @ 768-dim corpus is ~340 MB; the
#     rest is reserved for db-prev, telemetry, raw-PDF cache).
#   - Deploy strategy: rolling. Code via `fly deploy`; corpus refresh is
#     independent — the weekly GH Action scp's /data/db.sqlite.new onto
#     the volume and atomically renames.
#   - Embedding env vars (RBI_EMBEDDING_*) are baked into the Docker image.
#     CF auth (CF_ACCOUNT_ID, CF_API_TOKEN) lives in Fly secrets.

app = "rbi-source-mcp"
primary_region = "bom"  # Mumbai, closest to RBI source data + likely user base

[build]
  dockerfile = "Dockerfile"

[env]
  RBI_SOURCE_DB = "/data/db.sqlite"
  PYTHONUNBUFFERED = "1"
  # PORT is set by Fly automatically; rbi-source-mcp-http honors $PORT.

[[mounts]]
  source = "rbi_data"
  destination = "/data"
  initial_size = "1gb"

# v0.5+: HTTP transport. The container's ENTRYPOINT is rbi-source-mcp-http
# (set in Dockerfile) which binds to 0.0.0.0:$PORT. Fly's anycast handles
# TLS termination + global routing.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB is plenty post-v0.6: no resident embedding model, just the
  # Python interpreter + sqlite mmap pages + uvicorn. Was 2 GB when
  # bge-small (~250 MB) lived in-process; that justification is gone.
  # If working-set drift shows up in /metrics, bump back to 2 GB.
  memory = "1gb"

# Process group — single MCP HTTP server process.
[processes]
  app = "rbi-source-mcp-http --host 0.0.0.0 --port 8080"

# Deploy strategy: single-machine rolling restart (per /plan-eng-review).
# Code deploys via fly deploy; corpus refresh is independent (weekly GH Action
# scp's /data/db.sqlite.new and SIGHUPs the running process).
[deploy]
  strategy = "rolling"
