# RBI Source MCP — Fly.io app config
#
# Reference deployment template. Forking? Run `fly launch --copy-config`
# and Fly will prompt for a fresh app name; the rest of this config
# (region, memory, volume, health check) is sane defaults for this
# workload and can be tweaked to taste.
#
# Operational notes:
#   - Single Fly machine, shared-cpu-1x with 2 GB RAM. bge-small ~250 MB +
#     sqlite mmap'd pages + uvicorn + Python interpreter. 1 GB caused the
#     embedder's hot pages to evict between requests, 5-20x latency hit.
#   - auto_stop_machines = false (cold starts download bge-small from HF
#     and load it; ~75-200s on a fresh boot, not acceptable for a public MCP).
#   - 1 GB volume at /data (corpus is ~170 MB; the rest is reserved for
#     db-prev, telemetry, raw-PDF cache).
#   - Deploy strategy: rolling. Code via `fly deploy`; corpus refresh is
#     independent (a weekly GH Action will scp /data/db.sqlite.new and
#     SIGHUP the running process).

app = "rbi-source-mcp"
primary_region = "bom"  # Mumbai, closest to RBI source data + likely user base

[build]
  dockerfile = "Dockerfile"

[env]
  RBI_SOURCE_DB = "/data/db.sqlite"
  PYTHONUNBUFFERED = "1"
  # PORT is set by Fly automatically; rbi-source-mcp-http honors $PORT.

[[mounts]]
  source = "rbi_data"
  destination = "/data"
  initial_size = "1gb"

# v0.5+: HTTP transport. The container's ENTRYPOINT is rbi-source-mcp-http
# (set in Dockerfile) which binds to 0.0.0.0:$PORT. Fly's anycast handles
# TLS termination + global routing.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Bumped from 1 GB after observing memory pressure: bge-small ~250 MB +
  # Python interpreter + sqlite mmap'd pages + uvicorn was tight enough
  # that the embedder's pages got evicted between requests, causing
  # 5-20x latency on warm tool calls. Headroom on a shared-cpu-1x is
  # cheap (~$5/mo more) compared to brown-out risk on a public endpoint.
  memory = "2gb"

# Process group — single MCP HTTP server process.
[processes]
  app = "rbi-source-mcp-http --host 0.0.0.0 --port 8080"

# Deploy strategy: single-machine rolling restart (per /plan-eng-review).
# Code deploys via fly deploy; corpus refresh is independent (weekly GH Action
# scp's /data/db.sqlite.new and SIGHUPs the running process).
[deploy]
  strategy = "rolling"
