name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 20 min (was 10): the suite exercises the local sentence-transformers path,
    # which downloads the ~440 MB bge-base model on first use. With a warm HF
    # cache (below) a run finishes in ~2 min; the bump only covers a cold-cache
    # run (cache miss after a model-key change) where the download happens live
    # and previously tipped a lane over the 10-min limit.
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Cache the HuggingFace model store so the ~440 MB bge-base download
      # happens at most once per cache key instead of on every run (and dodges
      # anonymous HF Hub rate limits, which were stalling the 3.13 lane). The
      # files are Python-version-independent, so all matrix lanes share one key;
      # bump the key suffix if the default embedding model/revision ever changes
      # (see src/rbi_source_mcp/embedding_config.py).
      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-${{ runner.os }}

      - name: Install package + dev deps
        # v0.7.0: sentence-transformers is now in main deps (not an extra),
        # so plain `[dev]` covers everything the test suite needs to exercise
        # the local sentence-transformers path.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  # Validate every workflow file with actionlint. The repo lost six days of
  # corpus updates in May 2026 because a literal expression-syntax in a
  # comment inside a `run:` block silently disabled the corpus-release.yml
  # schedule. Local `yaml.safe_load` passed (YAML is structurally valid);
  # GitHub Actions' expression parser was the only thing that knew. The
  # pytest job above never touches workflow files, so without this job
  # the same class of issue would slip through CI again.
  #
  # actionlint runs the same expression parser GH does, plus shellcheck
  # on `run:` blocks, plus structural validation. Pinned to v1.7.12 by
  # download URL; binary is ~3 MB and downloads in <1s.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.12
          ARCH=$(uname -m)
          # rhysd/actionlint ships linux_amd64 and linux_arm64. Map.
          case "$ARCH" in
            x86_64)  ARCHIVE=actionlint_${VERSION}_linux_amd64.tar.gz ;;
            aarch64) ARCHIVE=actionlint_${VERSION}_linux_arm64.tar.gz ;;
            *)       echo "::error::unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}" \
            | tar -xz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/
          actionlint -version

      - name: Lint .github/workflows/*.yml
        # `-color` makes the failure mode readable on the PR page. Exit
        # code != 0 fails the job, which blocks merge under the strict
        # branch protection.
        run: actionlint -color
