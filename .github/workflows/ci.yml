name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev deps + local-embeddings
        # Production runtime ships with cloudflare provider only (no torch).
        # CI installs local-embeddings so the test suite can exercise the
        # local sentence-transformers path without making outbound CF calls.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,local-embeddings]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
