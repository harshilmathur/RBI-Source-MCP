name: Weekly corpus release

# Pipeline (v0.7+):
#   1. Seed staging DB from the previous corpus release (diff mode only)
#      so the indexers can skip unchanged PDFs via the content-hash JOIN
#      in build_all.py:already_indexed_ids().
#   2. Crawl RBI list pages → upsert into the staging DB.
#   3. Run all five indexers — fetches changed PDFs, extracts text,
#      chunks, embeds via Cloudflare Workers AI (bge-base @ 768-dim).
#   4. Stamp corpus_meta with build provenance (commit, timestamp,
#      embedding model + revision, schema version).
#   5. Smoke gate paired: rbi-source-eval ≥80% absolute AND <5pp drop
#      vs the previous release's pass rate.
#   6. On smoke pass: compress with xz, sigstore-sign, publish as a
#      GitHub Release asset. Self-hosters consume via
#      `rbi-source-fetch-corpus`; the maintainer's hosted instance pulls
#      via the deploy-corpus.sh script in the private deploy repo.
#   7. On smoke fail: abort, upload artifact for inspection, no release.
#
# Cost: ~$0 in diff mode (~50 CF Neurons/week; quota is 10k/day free).
# Full mode (monthly safety net) is ~3000 Neurons, still well under cap.
#
# This workflow REPLACES the old refresh.yml which atomic-renamed onto a
# Fly volume directly. The Fly piece is now operator-side: a deploy
# script in the private repo downloads the latest GitHub Release artifact
# and ships it to the volume. OSS users never touch Fly.

on:
  schedule:
    # Daily diff at 02:00 UTC (07:30 IST) so press releases published the
    # previous Indian business day are indexed by morning. Diff mode runs
    # ~5 min total + ~50 CF Neurons; well inside the free quota.
    - cron: "0 2 * * *"
    # Monthly full rebuild on the 1st at 03:00 UTC. Catches RBI silent
    # re-uploads (PDFs replaced without bumping the list-page date) that
    # diff mode can't see by definition.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "Build mode"
        options: [diff, full]
        default: diff

permissions:
  contents: write          # required to create the GitHub Release
  id-token: write          # required for sigstore OIDC signing
  actions: read

concurrency:
  group: corpus-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      RBI_EMBEDDING_PROVIDER: cloudflare
      RBI_EMBEDDING_MODEL: "@cf/baai/bge-base-en-v1.5"
      RBI_EMBEDDING_DIM: "768"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      RBI_SOURCE_DB_NEW: ${{ github.workspace }}/data/db.sqlite.new
      RBI_SOURCE_DB: ${{ github.workspace }}/data/db.sqlite.new
      # Determine effective mode: scheduled monthly cron (0 3 1 * *) → full,
      # scheduled daily cron (0 2 * * *) → diff, manual → use the input.
      # Note: on the 1st of each month BOTH crons fire (daily 02:00 UTC,
      # then monthly 03:00 UTC). The full rebuild at 03:00 overwrites the
      # latest-corpus alias from the earlier diff. ~10 extra min once a
      # month; acceptable.
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 3 1 * *' && 'full' || 'diff') }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install poppler-utils + xz + sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils sqlite3 xz-utils

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ─────────────────────────────────────────────────────────────
      # Diff-mode pre-stage: download the previous release's corpus so
      # build_all.py:already_indexed_ids() skips unchanged PDFs via the
      # content-hash JOIN. Full-mode skips this — empty staging DB =
      # full rebuild, catches silent RBI re-uploads.
      # ─────────────────────────────────────────────────────────────
      - name: Seed staging DB from latest release (diff mode)
        if: env.BUILD_MODE != 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release view latest-corpus --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download latest-corpus \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'corpus.sqlite.xz' \
              --output - \
              | xz -d > "$RBI_SOURCE_DB_NEW"
            echo "::notice::seeded staging from latest-corpus ($(stat -c%s "$RBI_SOURCE_DB_NEW") bytes)"
          else
            echo "::notice::no prior release found — first build, full crawl will run"
          fi

      - name: Crawl RBI list pages
        run: |
          mkdir -p data
          rbi-source-crawl

      - name: Verify list-page crawl is non-empty (early gate)
        run: |
          MD_COUNT=$(sqlite3 "$RBI_SOURCE_DB_NEW" "SELECT count(*) FROM documents WHERE document_family='master_direction';")
          WD_COUNT=$(sqlite3 "$RBI_SOURCE_DB_NEW" "SELECT count(*) FROM withdrawn;")
          echo "Master Directions: $MD_COUNT"
          echo "Withdrawn circulars: $WD_COUNT"
          if [ "$MD_COUNT" -lt 30 ]; then
            echo "::error::Suspicious: only $MD_COUNT MDs crawled (expected ~80+). Aborting before indexing."
            exit 1
          fi
          if [ "$WD_COUNT" -lt 5 ]; then
            echo "::error::Suspicious: only $WD_COUNT withdrawn circulars crawled. Aborting before indexing."
            exit 1
          fi

      - name: Diff summary (what's new/updated/skip)
        # Normalize fetched_at to a date for the comparison: pa.fetched_at
        # is full ISO 8601 with Z, d.last_updated_at is YYYY-MM-DD (and can
        # be year-only as a fallback). Mixed-precision lex comparison gives
        # wrong answers; date(...) coerces to YYYY-MM-DD on both sides.
        # Joined via document_id (the family-aware unique key) so a circular
        # and an MD with the same numeric md_id can't collide.
        run: |
          sqlite3 -header -column "$RBI_SOURCE_DB_NEW" "
            SELECT
              SUM(CASE WHEN pa.document_id IS NULL THEN 1 ELSE 0 END) AS new_mds,
              SUM(CASE WHEN pa.document_id IS NOT NULL
                        AND d.last_updated_at IS NOT NULL
                        AND date(pa.fetched_at) < d.last_updated_at THEN 1 ELSE 0 END) AS updated_mds,
              SUM(CASE WHEN pa.is_indexed = 1
                        AND (d.last_updated_at IS NULL
                             OR date(pa.fetched_at) >= d.last_updated_at) THEN 1 ELSE 0 END) AS skip_mds
            FROM documents d
            LEFT JOIN pdf_artifacts pa ON pa.document_id = d.document_id
            WHERE d.document_family='master_direction';
          "

      - name: Index Master Directions
        run: |
          if [ "$BUILD_MODE" = "full" ]; then
            rbi-source-index-all --force
          else
            rbi-source-index-all
          fi

      - name: Index Circulars
        run: rbi-source-index-all-circulars

      - name: Index Press Releases
        run: rbi-source-index-press-release --bulk

      - name: Index FAQs
        run: rbi-source-index-faq --bulk

      - name: Index Master Circulars
        run: rbi-source-index-master-circular --bulk

      # ─────────────────────────────────────────────────────────────
      # Stamp corpus_meta with build provenance so
      # `rbi-source-fetch-corpus` (PR2) can verify schema/embed compat
      # before installing.
      # ─────────────────────────────────────────────────────────────
      - name: Stamp corpus metadata
        # v0.8.1 review #2 fix: explicitly stamp schema_version from the
        # running CORPUS_SCHEMA_VERSION constant. _stamp_schema_version()
        # in connect() only writes when missing (correct semantics for
        # runtime), so the build is the source of truth for version
        # bumps. Without an explicit set_meta here, a diff-mode build
        # seeded from a previous corpus would keep the OLD stamp forever
        # even after the schema changes.
        #
        # provider != local → the local HF revision is irrelevant for this
        # build; stamp `n/a-<provider>` so corpus_meta reflects reality.
        # Local builds (rare in CI) get the actual env value if set, or
        # the default from embedding_config.LOCAL_MODEL_REVISION.
        run: |
          BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python -c "
          from rbi_source_mcp.db import CORPUS_SCHEMA_VERSION, connect, set_meta
          import os
          db = os.environ['RBI_SOURCE_DB_NEW']
          provider = os.environ.get('RBI_EMBEDDING_PROVIDER', 'local').strip().lower()
          if provider == 'local':
              from rbi_source_mcp.embedding_config import LOCAL_MODEL_REVISION
              revision = LOCAL_MODEL_REVISION
          else:
              revision = f'n/a-{provider}'
          with connect(db) as c:
              set_meta(c, 'schema_version',     CORPUS_SCHEMA_VERSION)
              set_meta(c, 'embedding_provider', provider)
              set_meta(c, 'embedding_model',    '${{ env.RBI_EMBEDDING_MODEL }}')
              set_meta(c, 'embedding_dim',      '${{ env.RBI_EMBEDDING_DIM }}')
              set_meta(c, 'embedding_revision', revision)
              set_meta(c, 'build_timestamp',    '$BUILD_TS')
              set_meta(c, 'build_commit',       '${{ github.sha }}')
              set_meta(c, 'build_mode',         '${{ env.BUILD_MODE }}')
          print(f'corpus_meta stamped (schema={CORPUS_SCHEMA_VERSION}, provider={provider}, revision={revision})')
          "

      # ─────────────────────────────────────────────────────────────
      # Smoke gate paired: ≥80% absolute AND <5pp drop from prior
      # release. Drop-detection prevents a regressed corpus shipping
      # silently when it still clears the absolute threshold (e.g.,
      # 95% → 81% would pass the absolute gate but break users).
      # ─────────────────────────────────────────────────────────────
      - name: Smoke gate (absolute ≥80% AND <5pp regression)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Absolute gate (rbi-source-eval exits non-zero if hit_rate < 0.80)
          rbi-source-eval --threshold 0.80 --json > eval-current.json
          CURRENT_PCT=$(jq -r '.hit_rate' eval-current.json)
          echo "Current pass rate: $CURRENT_PCT"

          # Regression gate (only if we have a prior release with a usable
          # eval.json to compare to). Defensively guard against null/empty
          # values — a malformed prior eval would crash the float() coercion
          # and fail the entire pipeline despite the current build being fine.
          if ! gh release view latest-corpus --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::no prior release — regression gate skipped (first build)"
            exit 0
          fi
          if ! gh release download latest-corpus \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'eval.json' \
                --output eval-prior.json 2>/dev/null; then
            echo "::notice::no eval.json on prior release — regression gate skipped"
            exit 0
          fi
          if [ ! -s eval-prior.json ]; then
            echo "::notice::eval.json on prior release is empty — regression gate skipped"
            exit 0
          fi
          PRIOR_PCT=$(jq -r '.hit_rate // empty' eval-prior.json)
          if [ -z "$PRIOR_PCT" ] || [ "$PRIOR_PCT" = "null" ]; then
            echo "::notice::eval.json on prior release has no hit_rate — regression gate skipped"
            exit 0
          fi
          DROP=$(python3 -c "print(round((float('$PRIOR_PCT') - float('$CURRENT_PCT')) * 100, 2))")
          echo "Prior pass rate: $PRIOR_PCT (drop: ${DROP} pp)"
          if python3 -c "import sys; sys.exit(0 if float('$DROP') < 5.0 else 1)"; then
            echo "::notice::regression gate passed (drop ${DROP}pp < 5pp)"
          else
            echo "::error::regression gate failed: drop of ${DROP}pp exceeds 5pp threshold"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # Compress + sign + publish.
      # ─────────────────────────────────────────────────────────────
      - name: Compress corpus
        run: |
          # xz -9 -T 0 = max compression, multi-threaded. ~252MB → ~80MB.
          xz -9 -T 0 -k "$RBI_SOURCE_DB_NEW"
          mv "$RBI_SOURCE_DB_NEW".xz corpus.sqlite.xz
          sha256sum corpus.sqlite.xz > corpus.sqlite.xz.sha256
          ls -lh corpus.sqlite.xz corpus.sqlite.xz.sha256

      - name: Sign corpus assets with sigstore
        # OIDC-issued (no API key in repo). sigstore-python writes
        # `<input>.sigstore.json` (bundle format) — naming below assumes that.
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            corpus.sqlite.xz
            corpus.sqlite.xz.sha256

      - name: Verify sigstore bundles exist
        # Belt-and-suspenders: if sigstore-python ever changes its default
        # output extension, the upload step will silently miss the file
        # because softprops/action-gh-release skips missing globs without
        # erroring. Assert here so we fail loud, not ship unsigned.
        run: |
          set -euo pipefail
          for f in corpus.sqlite.xz.sigstore.json corpus.sqlite.xz.sha256.sigstore.json; do
            if [ ! -s "$f" ]; then
              echo "::error::missing sigstore bundle: $f"
              ls -la
              exit 1
            fi
          done
          echo "::notice::sigstore bundles present: $(wc -c < corpus.sqlite.xz.sigstore.json) bytes + $(wc -c < corpus.sqlite.xz.sha256.sigstore.json) bytes"

      - name: Compute release tag
        id: tag
        # github.run_started_at is RFC3339 with `:` characters; Git refs
        # forbid `:`. Use github.run_id (immutable, monotonic, valid in
        # ref names) plus a sortable UTC date for human readability.
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "tag=corpus-${BUILD_DATE}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "name=Corpus build ${BUILD_DATE} (run ${{ github.run_id }})" >> "$GITHUB_OUTPUT"

      - name: Publish timestamped GitHub Release
        # Immutable timestamped tag = rollback target. The `latest-corpus`
        # alias gets updated separately below.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            Weekly corpus build (mode: `${{ env.BUILD_MODE }}`).

            - schema_version: 1
            - embedding_model: ${{ env.RBI_EMBEDDING_MODEL }} @ ${{ env.RBI_EMBEDDING_DIM }}-dim
            - build_commit: ${{ github.sha }}

            v0.7.0 self-hosters can download `corpus.sqlite.xz` directly.
            v0.7.1 will ship `rbi-source-fetch-corpus` for one-line install.
          files: |
            corpus.sqlite.xz
            corpus.sqlite.xz.sha256
            corpus.sqlite.xz.sigstore.json
            corpus.sqlite.xz.sha256.sigstore.json
            eval-current.json
          generate_release_notes: false

      - name: Update `latest-corpus` moving alias
        # We update assets in place via `--clobber` rather than
        # delete-then-create, which would create a 404 window for
        # consumers polling `latest-corpus`. Per autoplan/review feedback.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # If the alias release doesn't exist yet (first build), create it
          # empty before uploading; subsequent runs hit the upload --clobber path.
          if ! gh release view latest-corpus --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest-corpus \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Latest corpus (alias)" \
              --notes "Moving alias for the latest corpus build. Pin to a timestamped tag for immutability."
          fi
          gh release upload latest-corpus \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            corpus.sqlite.xz \
            corpus.sqlite.xz.sha256 \
            corpus.sqlite.xz.sigstore.json \
            corpus.sqlite.xz.sha256.sigstore.json \
            eval-current.json
          # Rename eval-current.json → eval.json on the alias for the
          # next run's regression-gate lookup.
          mv eval-current.json eval.json
          gh release upload latest-corpus eval.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: GC old timestamped corpus releases
        # Daily cron means we accumulate ~30 timestamped releases/month at
        # ~140 MB each. Without GC the Releases page becomes a wall of
        # corpus tags within weeks. Retention policy:
        #   - Keep the latest 14 daily timestamped releases (rolling 2 weeks
        #     of rollback targets).
        #   - Keep the most recent 12 monthly full rebuilds (1st-of-month
        #     tags: `corpus-YYYY-MM-01-*`) for ~1 year of monthly safety
        #     pins.
        #   - Always keep the `latest-corpus` moving alias (it's a release,
        #     not a timestamped tag, so it's never in the candidate set).
        # Delete everything else. Each delete passes --cleanup-tag so the
        # underlying git tag goes too.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEEP_DAILY=14
          KEEP_MONTHLY=12

          # All corpus-* timestamped tags (excludes the latest-corpus alias),
          # newest first.
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 500 \
            --json tagName,createdAt \
            --jq '.[] | select(.tagName | startswith("corpus-")) | select(.tagName != "latest-corpus") | .tagName' \
            > /tmp/all-tags.txt

          # Split into monthly (1st-of-month) and dailies. The tag format
          # `corpus-YYYY-MM-DD-<run_id>` makes this a clean regex.
          grep -E '^corpus-[0-9]{4}-[0-9]{2}-01-' /tmp/all-tags.txt | head -n "$KEEP_MONTHLY" > /tmp/keep-monthly.txt || true
          grep -vE '^corpus-[0-9]{4}-[0-9]{2}-01-' /tmp/all-tags.txt | head -n "$KEEP_DAILY"  > /tmp/keep-daily.txt   || true

          # Compute deletion list: everything in all-tags that isn't in
          # keep-daily or keep-monthly.
          sort /tmp/keep-daily.txt /tmp/keep-monthly.txt > /tmp/keep-all.txt
          sort /tmp/all-tags.txt > /tmp/all-sorted.txt
          comm -23 /tmp/all-sorted.txt /tmp/keep-all.txt > /tmp/delete.txt

          DEL_COUNT=$(wc -l < /tmp/delete.txt | tr -d ' ')
          KEEP_COUNT=$(wc -l < /tmp/keep-all.txt | tr -d ' ')
          echo "::notice::GC plan — keeping $KEEP_COUNT (daily $(wc -l < /tmp/keep-daily.txt | tr -d ' ') + monthly $(wc -l < /tmp/keep-monthly.txt | tr -d ' ')); deleting $DEL_COUNT"

          if [ "$DEL_COUNT" -gt 0 ]; then
            while read -r tag; do
              [ -z "$tag" ] && continue
              echo "  delete: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done < /tmp/delete.txt
          fi

      - name: Upload corpus artifact (workflow run, 30d retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbi-corpus-${{ github.run_id }}
          path: |
            data/db.sqlite.new
            corpus.sqlite.xz
            corpus.sqlite.xz.sha256
            eval-current.json
          retention-days: 30
