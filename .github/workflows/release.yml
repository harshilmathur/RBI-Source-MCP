name: Publish to PyPI

# Triggers on tag push: `v0.8.0`, `v1.2.3`, etc.
# Builds wheel + sdist via the `build` package, then publishes via
# trusted publishing (no PyPI API token in repo secrets — PyPI verifies
# the workflow's GitHub Actions OIDC identity directly).
#
# One-time setup before this workflow can publish anything:
#   1. Reserve `rbi-source-mcp` on https://pypi.org (manual upload of an
#      empty 0.0.0 placeholder, or upload the first real release)
#   2. https://pypi.org/manage/project/rbi-source-mcp/settings/publishing/
#      → "Add a new pending publisher" with:
#        - PyPI Project Name: rbi-source-mcp
#        - Owner:             harshilmathur
#        - Repository name:   RBI-Source-MCP
#        - Workflow name:     release.yml
#        - Environment name:  pypi   (matches the environment block below)
#   3. Push a `v0.8.0` tag — first run will publish + retire the pending
#      publisher into a permanent trusted publisher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Verify pyproject version matches tag
        # `v0.8.0` tag → version must be `0.8.0` in pyproject.toml.
        # Catches mistakes like tagging without bumping the version.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; import pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG_VERSION) does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi
          # Also verify __version__ matches.
          INIT_VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/rbi_source_mcp/__init__.py').read_text()).group(1))")
          if [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG_VERSION) does not match __init__.py version $INIT_VERSION"
            exit 1
          fi
          echo "version matches: $TAG_VERSION"

      - name: Build wheel + sdist
        run: python -m build

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rbi-source-mcp
    permissions:
      id-token: write   # OIDC trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` field — the action exchanges the GitHub Actions
        # OIDC token for a short-lived PyPI upload token. PyPI verifies
        # the OIDC identity matches the trusted publisher we registered.
        with:
          packages-dir: dist/

  sigstore-sign:
    # Optional but recommended: sign the published artifacts with sigstore
    # too, so anyone can verify the wheel/sdist hasn't been tampered with
    # post-publish (defense against PyPI compromise + a rogue maintainer).
    name: Sigstore-sign artifacts
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # to attach signatures to the GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Sign with sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      - name: Attach signatures to GitHub Release
        # The git tag already created a Release (or the user did manually);
        # this step uploads the .sigstore.json bundles to it. If no Release
        # exists for the tag, create one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            ./dist/*.sigstore.json
