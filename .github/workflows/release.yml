name: Publish to PyPI

# Triggers on tag push: `v0.8.0`, `v1.2.3`, etc.
#
# v0.8.1 review #5 fix: signing happens in the BUILD job, not after
# publish. Previous ordering (publish-then-sign) meant a sigstore
# failure would leave an unsigned wheel live on PyPI permanently. Now:
#
#   build (incl. sigstore-sign of wheel + sdist)
#       │
#       ├──> publish (PyPI trusted publishing)
#       └──> attach-release (upload dist + sigstore bundles to GH Release)
#
# Both consumers run in parallel from the signed artifacts. If signing
# fails, build fails, nothing publishes. If publish OR attach fails
# independently, the other still completes.
#
# One-time setup before this workflow can publish anything:
#   1. Reserve `rbi-source-mcp` on https://pypi.org (manual upload of an
#      empty 0.0.0 placeholder, or upload the first real release).
#   2. https://pypi.org/manage/project/rbi-source-mcp/settings/publishing/
#      → "Add a new pending publisher" with:
#        - PyPI Project Name: rbi-source-mcp
#        - Owner:             harshilmathur
#        - Repository name:   RBI-Source-MCP
#        - Workflow name:     release.yml
#        - Environment name:  pypi   (matches the publish job below)
#   3. Push a `v0.8.0` tag — first run will publish + retire the pending
#      publisher into a permanent trusted publisher.
#
# Action pinning: pinned to commit SHAs (v0.9 hardening). Tag-pin tracked
# next to each SHA in a `# pin: <action>@<tag>` comment so Dependabot's
# action-name+tag matcher continues to surface upgrades. SHAs lock the
# build against tag-retag attacks on the publishing path
# (pypa/gh-action-pypi-publish, sigstore/gh-action-sigstore-python).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + sigstore

jobs:
  build:
    name: Build + sign distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pin: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Verify pyproject + __init__ versions match tag
        # `v0.8.0` tag → version must be `0.8.0` in pyproject.toml AND
        # __init__.py. Catches mistakes like tagging without bumping.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; import pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG_VERSION) does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi
          INIT_VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/rbi_source_mcp/__init__.py').read_text()).group(1))")
          if [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG_VERSION) does not match __init__.py version $INIT_VERSION"
            exit 1
          fi
          echo "version matches: $TAG_VERSION"

      - name: Build wheel + sdist
        run: python -m build

      - name: Sigstore-sign wheel + sdist (BEFORE publish)
        # If this fails, the `build` job fails, downstream `publish` and
        # `attach-release` never run, so PyPI never sees an unsigned wheel.
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc  # pin: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      - name: Verify sigstore bundles exist
        # Belt-and-suspenders: fail if sigstore output filename ever drifts
        # so the upload step can't silently miss a sig.
        run: |
          set -euo pipefail
          for f in ./dist/*.sigstore.json; do
            [ -s "$f" ] || { echo "::error::missing or empty sigstore bundle"; ls -la dist/; exit 1; }
          done
          echo "::notice::$(ls dist/*.sigstore.json | wc -l) sigstore bundles signed"

      - name: List built + signed artifacts
        run: ls -la dist/

      - name: Upload artifacts (dist + sigstore bundles)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # pin: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rbi-source-mcp
    permissions:
      id-token: write   # OIDC trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # pin: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Strip sigstore bundles before PyPI upload
        # PyPI rejects unrecognized files in the upload set. Sigstore
        # bundles go to the GitHub Release in the parallel job.
        run: rm -f dist/*.sigstore.json

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # pin: pypa/gh-action-pypi-publish@v1.14.0
        # No `password:` field — the action exchanges the GitHub Actions
        # OIDC token for a short-lived PyPI upload token. PyPI verifies
        # the OIDC identity matches the trusted publisher registered
        # at one-time-setup step 2 (see file header).
        with:
          packages-dir: dist/

  attach-release:
    name: Attach signed artifacts to GitHub Release
    needs: build
    # Runs in parallel with `publish` so a publish failure doesn't block
    # signature attachment, and an attach failure doesn't leave PyPI
    # orphaned. Both depend on `build`, which already signed everything.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update the GH Release

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # pin: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release with signed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
          # Upload everything — wheel, sdist, and sigstore bundles — so
          # users can `pip download + sigstore verify` independently of
          # PyPI's hosting.
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            ./dist/*.tar.gz \
            ./dist/*.whl \
            ./dist/*.sigstore.json
