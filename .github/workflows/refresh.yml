name: Weekly corpus refresh

# Pipeline:
#   1. Crawl RBI list pages (MDs + withdrawn) into a fresh db.sqlite.new
#   2. Run all five indexers — pulls PDFs, extracts text, chunks, and
#      embeds via Cloudflare Workers AI (bge-base @ 768-dim).
#   3. Run rbi-source-eval as a smoke gate (>= 80% pass required).
#   4. On smoke pass: scp the new db onto the Fly volume + atomic-rename.
#      The running server keeps its existing fd on the old (now-unlinked)
#      inode until the next connection cycle — no downtime.
#   5. On smoke fail: abort, upload artifact for inspection, live db
#      stays untouched.
#
# Cost: ~$0 (CF Workers AI free tier covers 56k chunks @ ~3k neurons total
# weekly; well under 10k/day cap). GHA runner covered by repo's free minutes.

on:
  schedule:
    # Every Sunday at 02:00 UTC (07:30 IST Sunday morning).
    - cron: "0 2 * * 0"
  workflow_dispatch: {}  # Allow manual runs from the Actions tab.

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh
  cancel-in-progress: false  # Don't kill an in-flight refresh; queue the next.

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # full rebuild: ~30-60 min; headroom for slow RBI fetches

    env:
      # CF embedding provider — same defaults baked into the runtime image.
      RBI_EMBEDDING_PROVIDER: cloudflare
      RBI_EMBEDDING_MODEL: "@cf/baai/bge-base-en-v1.5"
      RBI_EMBEDDING_DIM: "768"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Both crawler (RBI_SOURCE_DB_NEW) and indexers (RBI_SOURCE_DB) write
      # to the same staging file. Only after smoke-pass does it ship to Fly.
      RBI_SOURCE_DB_NEW: ${{ github.workspace }}/data/db.sqlite.new
      RBI_SOURCE_DB: ${{ github.workspace }}/data/db.sqlite.new

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install poppler-utils (pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils sqlite3

      - name: Install package
        # No `local-embeddings` extra — refresh embeds via CF over HTTPS,
        # not torch. Smaller install, faster cold runner. Unit tests are
        # already gated in ci.yml; rerunning them here is redundant.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Crawl RBI list pages
        run: |
          mkdir -p data
          rbi-source-crawl

      - name: Show crawl audit
        run: |
          echo "--- crawl_runs ---"
          sqlite3 "$RBI_SOURCE_DB_NEW" \
            "SELECT source, status_code, items_seen, items_added, items_changed, error FROM crawl_runs ORDER BY id DESC LIMIT 5;" \
            || true

      - name: Verify list-page crawl is non-empty (early gate)
        run: |
          MD_COUNT=$(sqlite3 "$RBI_SOURCE_DB_NEW" "SELECT count(*) FROM documents;")
          WD_COUNT=$(sqlite3 "$RBI_SOURCE_DB_NEW" "SELECT count(*) FROM withdrawn;")
          echo "Master Directions: $MD_COUNT"
          echo "Withdrawn circulars: $WD_COUNT"
          if [ "$MD_COUNT" -lt 30 ]; then
            echo "::error::Suspicious: only $MD_COUNT MDs crawled (expected ~80). Aborting before indexing."
            exit 1
          fi
          if [ "$WD_COUNT" -lt 5 ]; then
            echo "::error::Suspicious: only $WD_COUNT withdrawn circulars crawled. Aborting before indexing."
            exit 1
          fi

      - name: Index Master Directions (PDF → chunks → CF embed)
        run: rbi-source-index-all

      - name: Index Circulars
        run: rbi-source-index-all-circulars

      - name: Index Press Releases
        run: rbi-source-index-press-release --bulk

      - name: Index FAQs
        run: rbi-source-index-faq --bulk

      - name: Index Master Circulars
        run: rbi-source-index-master-circular --bulk

      - name: Smoke gate (rbi-source-eval, threshold 80%)
        # If this fails, the new corpus never lands on Fly.
        run: rbi-source-eval --threshold 0.80

      - name: Upload corpus artifact
        # Manual inspection from the Actions UI without committing the SQLite to git.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbi-corpus-${{ github.run_id }}
          path: data/db.sqlite.new
          retention-days: 30

      - name: Install flyctl
        # Needed to ship the corpus + atomic-rename. App-scoped FLY_API_TOKEN
        # comes from `fly tokens create deploy -a rbi-source-mcp` (run locally
        # once and stored in GHA secrets).
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Pre-clean stale staging file on Fly volume
        # If a previous refresh failed mid-rename, /data/db.sqlite.new can
        # be left behind. `flyctl sftp put` errors with "remote file already
        # exists" rather than overwriting, so without this pre-clean a single
        # broken run would block every subsequent weekly cron until manual
        # intervention.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console -a rbi-source-mcp -C "rm -f /data/db.sqlite.new" || true

      - name: Push new corpus to Fly volume
        # Use `flyctl sftp put` (one-shot, proper exit codes) instead of
        # `flyctl ssh sftp shell` with heredoc — the shell form has been
        # observed silently hanging or returning 0 on partial uploads,
        # which would let the atomic-rename step replace the live corpus
        # with a truncated one.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl sftp put data/db.sqlite.new /data/db.sqlite.new -a rbi-source-mcp

      - name: Verify upload + atomic-swap corpus
        # Belt-and-suspenders: stat both ends and bail if the bytes don't
        # match before swapping the live corpus. We watched a 252 MB upload
        # truncate to 94 MB once due to a wireguard tunnel hiccup; without
        # this gate, that would have replaced the live corpus with a broken
        # one. The atomic rename pattern (mv old → db-prev, mv new → live)
        # keeps the running server's open fd on the old inode, so in-flight
        # requests don't break — only the next request reopens and sees the
        # fresh corpus.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          expected=$(stat -c%s data/db.sqlite.new)
          actual=$(flyctl ssh console -a rbi-source-mcp -C "stat -c%s /data/db.sqlite.new" | tr -d '[:space:]')
          if [ "$expected" != "$actual" ]; then
            echo "::error::corpus size mismatch (local=$expected bytes, remote=$actual bytes) — refusing to swap"
            flyctl ssh console -a rbi-source-mcp -C "rm -f /data/db.sqlite.new" || true
            exit 1
          fi
          flyctl ssh console -a rbi-source-mcp -C "sh -c 'mv /data/db.sqlite /data/db-prev.sqlite && mv /data/db.sqlite.new /data/db.sqlite'"
          flyctl ssh console -a rbi-source-mcp -C "sqlite3 /data/db.sqlite 'SELECT COUNT(*) FROM chunks;'"
