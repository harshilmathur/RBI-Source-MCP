# Local self-host. Two services share the same image:
#
#   docker compose up                  → run the HTTP server on :8080
#   docker compose run --rm crawl      → one-shot corpus crawl (populates
#                                         the rbi_data volume; needed once
#                                         on a fresh deployment, then again
#                                         per refresh cycle)
#
# After the first crawl + index run, the volume holds /data/db.sqlite and
# the HTTP server has something to serve. See README "Run your own copy"
# for the full bootstrap (crawl → index 5 families → eval gate → run).

services:
  rbi-source-mcp:
    build: .
    image: rbi-source-mcp:dev
    container_name: rbi-source-mcp
    ports:
      - "8080:8080"
    environment:
      RBI_SOURCE_DB: /data/db.sqlite
      PYTHONUNBUFFERED: "1"
    volumes:
      - rbi_data:/data
    restart: unless-stopped

  # One-shot crawler. Run with: `docker compose run --rm crawl`.
  crawl:
    build: .
    image: rbi-source-mcp:dev
    environment:
      RBI_SOURCE_DB: /data/db.sqlite
      PYTHONUNBUFFERED: "1"
    volumes:
      - rbi_data:/data
    entrypoint: ["/app/entrypoint.sh", "rbi-source-crawl"]
    profiles: ["ops"]

volumes:
  rbi_data:
